# Everything in one go: Ollama (the brain), Laya (the decision model) and Motes (the agents).
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen3:14b
#   open http://localhost:7777
# For NVIDIA GPUs, uncomment the deploy block.
services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  laya:
    build: deploy/laya
    environment:
      LAYA_PRELOAD: "1"
      LAYA_MODELS: "english,multilingual"
      # LAYA_API_KEY: set the same value in .env for Motes (it reads LAYA_API_KEY)
    volumes: [laya:/root/.cache/huggingface]
    restart: unless-stopped

  motes:
    build: .
    depends_on: [ollama, laya]
    ports: ["127.0.0.1:7777:7777"]
    volumes:
      - motes:/data
      - ./examples/docker-config.yaml:/data/config.yaml
    env_file: {path: .env, required: false}
    restart: unless-stopped

volumes:
  ollama:
  laya:
  motes:
