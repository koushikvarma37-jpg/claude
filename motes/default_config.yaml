# Motes configuration. Lives at ~/.motes/config.yaml (override with MOTES_HOME).

# The brain: plans and calls tools. Any OpenAI-compatible endpoint works:
#   Ollama     http://localhost:11434/v1
#   LM Studio  http://localhost:1234/v1
#   vLLM       http://localhost:8000/v1
#   llama.cpp  http://localhost:8080/v1
brain:
  base_url: http://localhost:11434/v1
  model: qwen3:14b
  api_key: local
  temperature: 0.3
  # Set false for models without native function calling; Motes then uses
  # a text protocol that any instruction-following model can follow.
  native_tools: true
  timeout_seconds: 300

# The decision model: judges every risky action before it runs.
decision:
  enabled: true
  # laya: Laya, a System-1 decision engine (https://github.com/NandhaKishorM/laya).
  #       Calibrated probabilities in one forward pass, 100+ languages. Recommended.
  # llm:  a prompted chat model acting as judge (any model on an OpenAI-compatible server).
  engine: laya
  # Minimum confidence for the decision model to approve on your behalf.
  min_confidence: 0.8
  laya:
    # http:  talk to `laya-serve` (pip install "laya[serve]" && laya-serve)
    # local: load Laya inside Motes (pip install "motes[laya]")
    mode: http
    url: http://localhost:8000
    api_key_env: LAYA_API_KEY
    # english | multilingual | typed-decisions. Empty = Laya picks by language.
    model: ""
    # local mode: path or Hugging Face id of your own fine-tuned checkpoint.
    checkpoint: ""
    device: ""
    # Token budget per decision (0 = checkpoint default). Multilingual reads up to 8192.
    max_len: 0
    # Ask the verdict under every option order and average (cancels position bias).
    rotate_options: true
    # Deny outright when P(action follows injected instructions) reaches this.
    injection_threshold: 0.5
    # Turn an "approve" into "ask me" when P(serves the goal) falls below on_goal_floor
    # or P(hard to undo) reaches irreversible_ceiling.
    on_goal_floor: 0.5
    irreversible_ceiling: 0.5
  # Laya is System 1 and answers every decision. When its confidence is below `below`
  # (or Laya is unreachable), System 2 thinks it through with the chat model below.
  system2:
    enabled: true
    below: 0.8
  # The chat model for System 2 (or the only judge, with engine: llm).
  llm:
    base_url: http://localhost:11434/v1
    model: qwen3:4b
    api_key: local

# Risk levels, lowest to highest: read < write < external < destructive
#   read        looks at things (read a file, fetch a page, list mail)
#   write       changes local state (write a file, save a note)
#   external    acts on the world (send an email, post a message, pay)
#   destructive hard or impossible to undo (delete, force-push, rm -rf)
autonomy:
  auto_approve: [read, write]      # runs without asking
  review: [write]                  # auto-approved, but the decision model can veto
  # Actions above auto_approve wait in your approvals inbox...
  # ...unless unattended mode is on, in which case the decision model may approve
  # `external` actions while you sleep. `destructive` always waits for you.
  unattended: false
  max_steps: 40

daemon:
  tick_seconds: 10
  concurrency: 3

server:
  host: 127.0.0.1
  port: 7777
  # Required for webhook/API calls when set. Always set this if you expose the port.
  token: ""

tools:
  shell: true
  files: true
  web: true
  email: false

# SMTP/IMAP for the email tools (tools.email: true)
email:
  smtp_host: ""
  smtp_port: 587
  imap_host: ""
  username: ""
  password_env: MOTES_EMAIL_PASSWORD
  from_address: ""

# Where Motes pings you. Apprise URLs cover 100+ services (Telegram, Discord,
# Slack, ntfy, Signal, email...): https://github.com/caronc/apprise
notify:
  desktop: true
  apprise_urls: []

# Apps via the Model Context Protocol. `motes apps` lists ready-made presets;
# `motes apps add <name>` copies one here.
mcp_servers: []
